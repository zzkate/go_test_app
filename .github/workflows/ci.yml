name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты (go test -race)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go_test_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_test_app/go.mod
          cache-dependency-path: go_test_app/go.sum

      - name: Проверка форматирования
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: Тесты с детектором гонок
        run: go test -race -count=1 -v ./...

  e2e:
    name: E2E (Docker + curl)
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: go_test_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Поднять сервис в Docker
        run: docker compose up -d --build

      - name: curl-тесты
        run: bash scripts/curl_tests.sh http://127.0.0.1:8080

      - name: Логи контейнера при падении
        if: failure()
        run: docker compose logs --no-color

      - name: Остановить сервис
        if: always()
        run: docker compose down -v

  bench:
    name: Бенчмарки
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: go_test_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_test_app/go.mod
          cache-dependency-path: go_test_app/go.sum

      - name: Запуск бенчмарков
        run: go test -run '^$' -bench . -benchmem -count=1 -timeout 5m ./app | tee bench.txt

      - name: Сохранить результаты
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: go_test_app/bench.txt
